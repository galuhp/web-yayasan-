site:
  name: 'Panti Asuhan Attaufiq Malang'
  site: 'https://attaufiq.rote.biz.id'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: 'Panti Asuhan Attaufiq Malang'
    template: '%s — Panti Asuhan Attaufiq Malang'
  description: 'Yayasan Anak Yatim At-Taufiq Malang — Lembaga sosial keagamaan pengasuhan, pendidikan, dan pembinaan kemandirian anak yatim, piatu, dan dhuafa sejak 1996.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'Panti Asuhan Attaufiq Malang'
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: id
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'berita' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'kategori' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'topik' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
